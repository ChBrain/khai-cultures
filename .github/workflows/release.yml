name: release

# Changesets-driven release for a khai plays house.
#
# On every push to main:
#   * If unreleased changeset files exist, the action opens/updates a
#     "Version Packages" PR that bumps the version and writes the CHANGELOG.
#     Merging that PR consumes the changesets.
#   * If there are no pending changesets (the version PR was just merged),
#     the action runs `changeset publish`, which publishes the house package
#     to GitHub Packages and pushes its git tag.
#
# ── Token requirements ───────────────────────────────────────────────────────
# RELEASE_TOKEN must be a PAT with:
#   * Contents: Read and write   (push the changeset-release/main branch + tags)
#   * Pull requests: Read and write   (open the Version PR)
# The built-in GITHUB_TOKEN cannot drive the git pushes here: GitHub suppresses
# workflow runs on commits made by GITHUB_TOKEN (anti-recursion), so the Version
# PR would never get CI and could never be merged green.

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: "https://npm.pkg.github.com"
          scope: "@chbrain"
          cache: "npm"

      - name: install
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: test
        run: npm test

      - name: changesets release
        uses: changesets/action@v2
        with:
          # changesets/action v2 renamed these inputs; under the old names the
          # action fails outright rather than falling back, so a bump that did
          # not rename them takes the whole release with it.
          version-script: npm run version
          publish-script: npm run release
          # v2's second break: it has a `github-token` input that defaults to the
          # built-in token, and it refuses to run when a GITHUB_TOKEN env var is
          # set to something else. The PAT therefore goes in the input now. It
          # cannot simply be dropped in favour of the default -- see the token
          # note at the top: GITHUB_TOKEN suppresses workflow runs on the commits
          # it makes, so the Version PR would never get CI and could never merge.
          github-token: ${{ secrets.RELEASE_TOKEN }}
        env:
          # Only the registry token stays in env; this one is read by npm during
          # `changeset publish`, not by the action.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
