name: plot-line-audit

# The audit lane from management/orders/order_the_passport.md, and the second
# half of it: `tests/plot_line_audit.mjs` builds the question, this sends it to a
# reader that is not the author, and posts the answer on the pull request.
#
# It asks one thing. For each plot in a touched culture, who or what acts in its
# Cue, and is that the state or one of its instruments. A plot line where nearly
# every answer is the state has described a passport rather than a culture, which
# is the failure the order records: three cultures shipped that way in a week,
# eighteen plots with sixteen of them a state acting, and the author cited the
# order in all three while breaking it. That is the case for a second reader
# rather than a better rule. The one who wrote a plot line is the one who cannot
# see this in it.
#
# It never fails the build, and it never scores. The order measured two
# mechanical counters for this against all 322 plots in the house and both fail,
# one passing the worst offender and one inverted, so this lane reports and a
# person decides. If it is ever gated, the order asks for a distribution across
# the house first, the way order_plot_zero.md measured 290 opening dates before
# fixing anything.
#
# THERE IS NO DEFAULT READER, AND THAT IS NOT AN OVERSIGHT. This lane was written
# against GitHub Models, which served inference to a workflow on the built-in
# GITHUB_TOKEN and needed no secret. GitHub retired GitHub Models on 30 July
# 2026 - playground, model catalog, inference API and bring-your-own-key, for
# every customer - about eight weeks before this lane first ran. The endpoint is
# still up and still answers the POST with HTTP 200 and the body `OK`, which is
# why three fixes went into the calling code before anyone checked whether
# anything was listening: a 302 that killed `jq`, a `-L` that turned the POST
# into a GET, and only then the bare `OK` from a retired API with no redirect in
# front of it. The call was wrong all three times. It was also never going to
# work.
#
# So the lane ships unwired, and unwired is a working mode: it posts the question
# with every Cue extracted, and a person answers it in about a minute per
# culture. `order_the_passport.md` asks for a reader who is not the author, and a
# person is the strongest reader that description allows.
#
# To wire a machine reader, set the `AUDIT_ENDPOINT` and `AUDIT_MODEL` variables
# and the `AUDIT_API_KEY` secret to something that serves the OpenAI-compatible
# chat-completions shape. Do not point it at the model that writes the cultures.
#
# Do not point it at the model that writes the cultures. A model auditing its own
# plot line is a mirror, and the whole value here is that the reader is somebody
# else. The default is deliberately not the house's author, for that reason.
#
# Fork pull requests get the unwired path by design: `pull_request` withholds
# secrets from forks, and that is the correct trade.

on:
  pull_request:
    paths:
      # Both homes. A migrated culture is `packages/khai-cultures-<id>/`; one
      # still in the umbrella is `packages/khai-cultures/cultures/<id>/`, which
      # the first two patterns cannot match - no hyphen suffix, one segment
      # deeper. Measured when that was found: 795 plot files across 206 umbrella
      # cultures matched nothing against 748 across 123 migrated ones, so this
      # lane had never run on two thirds of the house, including the three
      # cultures whose staging prompted it.
      - "packages/khai-cultures-*/plot_*.md"
      - "packages/khai-cultures-*/play_*.md"
      - "packages/khai-cultures/cultures/*/plot_*.md"
      - "packages/khai-cultures/cultures/*/play_*.md"

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # No install: the extractor uses node builtins only, deliberately, so this
      # lane cannot be broken by a registry it does not need.
      - name: build the question
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tests/plot_line_audit.mjs --base "$BASE_SHA" --head "$HEAD_SHA" > question.md

      - name: ask the second reader
        id: ask
        continue-on-error: true
        env:
          # All three are empty unless a house sets them. The service that used to
          # fill them is retired, and a default nobody can reach is worse than
          # none: it reports a failed reader instead of an unwired lane.
          AUDIT_API_KEY: ${{ secrets.AUDIT_API_KEY }}
          AUDIT_ENDPOINT: ${{ vars.AUDIT_ENDPOINT }}
          AUDIT_MODEL: ${{ vars.AUDIT_MODEL }}
        run: |
          if [ -z "$AUDIT_API_KEY" ] || [ -z "$AUDIT_ENDPOINT" ] || [ -z "$AUDIT_MODEL" ]; then
            echo "wired=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -n --rawfile q question.md --arg m "$AUDIT_MODEL" \
            '{model: $m, messages: [{role: "user", content: $q}]}' > body.json
          # `-L` because the endpoint answers with a redirect. Curl drops the
          # Authorization header when a redirect crosses to another host, and that
          # is the property that makes following one safe here. Never
          # `--location-trusted`: it hands the token to whatever host the redirect
          # names.
          #
          # `--post301 --post302 --post303` because a redirect that turns this into
          # a GET is not this request. Curl's default on those three is to drop the
          # method and the body, which is what happened the first time `-L` ran
          # here: the question went nowhere, the redirect target answered a bare
          # `OK` to the GET, and the lane reported a reply that was not the
          # chat-completions shape. It was not a reply to the question at all.
          #
          # The status is read here rather than left to `--fail-with-body`, which
          # only fails from 400 up. A 302 walked straight through it: curl exited
          # 0, `jq` met the redirect stub `<a href="...">Found</a>.` and died on
          # column 3, and the lane could say only that the reader could not be
          # reached. Each outcome now writes one line to `why.txt`, the comment
          # carries that line, and the reply's first bytes go to the job log.
          #
          # Where a redirect lands is part of the diagnosis, so the hop count and
          # the final URL are read out too, and named in `why.txt` when there was
          # one. The first fix here could say what came back but not where from.
          set +e
          MEASURED="$(curl -sS -L --post301 --post302 --post303 --max-time 180 \
            -o reply.json -w '%{http_code} %{num_redirects} %{url_effective}' \
            "$AUDIT_ENDPOINT" \
            -H "Authorization: Bearer $AUDIT_API_KEY" \
            -H "content-type: application/json" \
            --data @body.json)"
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "the endpoint never answered, curl exit $RC" > why.txt
            cat why.txt
            exit 1
          fi
          read -r CODE HOPS LANDED <<< "$MEASURED"
          echo "the endpoint answered HTTP $CODE after $HOPS redirect(s), from $LANDED"
          WENT=""
          if [ "${HOPS:-0}" != "0" ]; then
            WENT=" (after $HOPS redirect(s), from $LANDED)"
          fi
          if [ "$CODE" != "200" ]; then
            echo "the endpoint answered HTTP $CODE, not 200$WENT" > why.txt
            cat why.txt
            echo "--- the first 400 bytes of the reply ---"
            head -c 400 reply.json
            echo
            exit 1
          fi
          if ! jq -r '.choices[0].message.content // empty' reply.json > answer.md; then
            echo "HTTP 200, and a reply that is not the chat-completions shape$WENT" > why.txt
            cat why.txt
            echo "--- the first 400 bytes of the reply ---"
            head -c 400 reply.json
            echo
            exit 1
          fi
          # Not `[ -s answer.md ]`: a `content` of "" leaves `jq -r` a newline,
          # which has a size, and the lane would have posted an empty reading as
          # though a reader had spoken.
          if ! grep -q '[^[:space:]]' answer.md; then
            : > answer.md
            echo "HTTP 200, the chat-completions shape, and an empty answer$WENT" > why.txt
            cat why.txt
            exit 1
          fi
          echo "wired=true" >> "$GITHUB_OUTPUT"

      - name: post it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          WIRED: ${{ steps.ask.outputs.wired }}
          ASKED: ${{ steps.ask.outcome }}
        run: |
          MARK="<!-- plot-line-audit -->"
          {
            echo "$MARK"
            echo "## Plot line audit"
            echo
            if [ "$WIRED" = "true" ] && [ -s answer.md ]; then
              cat answer.md
              echo
              echo "---"
              echo
              echo "Advisory. This lane never fails a build and never scores; see"
              echo "\`management/orders/order_the_passport.md\` for why a counter was not built."
            else
              if [ "$ASKED" = "failure" ]; then
                echo "**The second reader could not be reached**, so here is the question instead."
                if [ -s why.txt ]; then
                  echo
                  echo "What the lane saw: $(cat why.txt). The job log for this run holds the"
                  echo "first bytes of the reply."
                fi
              else
                echo "**No second reader answered**, so here is the question instead. Paste"
                echo "it into any model that did not write this culture, or answer it by hand"
                echo "- it takes about a minute per culture."
                echo
                echo "No reader is wired here. GitHub Models, which this lane was written"
                echo "against, was retired on 30 July 2026. To wire another, set the"
                echo "\`AUDIT_ENDPOINT\` and \`AUDIT_MODEL\` variables and the \`AUDIT_API_KEY\`"
                echo "secret - and not to the model that writes these cultures."
              fi
              echo
              echo "<details><summary>The question</summary>"
              echo
              echo '```markdown'
              cat question.md
              echo '```'
              echo
              echo "</details>"
            fi
          } > comment.md

          # `--paginate` runs `--jq` once per page and concatenates, so `last`
          # can yield one id per page; `tail -1` keeps this to a single value.
          ID="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
                --jq "[.[] | select(.body | startswith(\"$MARK\"))] | last | .id // empty" \
                | tail -1)"
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${ID}" \
              -F body=@comment.md > /dev/null
            echo "updated comment $ID"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
              -F body=@comment.md > /dev/null
            echo "posted a new comment"
          fi
